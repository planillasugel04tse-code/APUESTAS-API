[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-betstotal"
version = "0.1.0"
description = "ANALISYS BETSTOTAL - plataforma de análisis de cuotas y oportunidades deportivas"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "telethon>=1.41,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
betstotal-telegram = "betano_analyzer.telegram.listener:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
